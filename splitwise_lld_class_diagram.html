<style>
#cd svg.classDiagram .divider path { stroke-opacity: 0.5; }
#cd svg.classDiagram .row-rect-odd path,
#cd svg.classDiagram .row-rect-odd rect,
#cd svg.classDiagram .row-rect-even path,
#cd svg.classDiagram .row-rect-even rect { stroke: none !important; }
</style>
<h2 class="sr-only">UML class diagram for the Splitwise low level design, showing Splitwise, Group, User, Expense, Split, DebtSimplifier, Observer, SplitFactory, SplitStrategy and its implementations</h2>
<div id="cd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const src = `classDiagram
    class Splitwise {
        <<Singleton>>
        -Map~String,User~ users
        -Map~String,Group~ groups
        -Map~String,Expense~ expenses
        +settleIndividualPayment()
        +addIndividualExpense()
    }
    class DebtSimplifier {
        +simplifyDebt(balances) List~Txn~
    }
    class Group {
        +String groupId
        +String name
        +List~User~ members
        +Map~String,Expense~ expenses
        +Map~String,double~ balances
        +addMember(user)
        +removeMember(userId)
        +notify(msg)
        +updateGroupBal(fromId, toId, amt)
        +addExpense(expense)
        +settlePayment(from, to, amt)
        +simplifyDebt()
    }
    class Observer {
        <<abstract>>
        +update(msg)
    }
    class User {
        +String userId
        +String name
        +String email
        +Map~String,double~ balances
        +update(msg)
        +updateBalance(otherId, amt)
    }
    class Expense {
        <<Model>>
        +String id
        +String description
        +double amount
        +String paidByUserId
        +List~Split~ splits
        +String groupId
    }
    class SplitFactory {
        +getSplitStrategy(type) SplitStrategy
    }
    class Split {
        <<Model>>
        +String userId
        +double amount
    }
    class SplitStrategy {
        <<interface>>
        +calcSplit(amt, userIds, values) List~Split~
    }
    class ExactSplit {
        +calcSplit(amt, userIds, values) List~Split~
    }
    class EqualSplit {
        +calcSplit(amt, userIds, values) List~Split~
    }
    class SplitType {
        <<enumeration>>
        EQUAL
        EXACT
        PERCENTAGE
    }
    Splitwise --> DebtSimplifier
    Splitwise "1" o-- "*" Group
    Splitwise "1" o-- "*" User
    Group "1" *-- "*" Expense
    Group "1" o-- "*" User : members
    User --|> Observer
    Expense "1" *-- "*" Split
    Expense --> SplitFactory
    SplitFactory ..> SplitType
    SplitFactory ..> SplitStrategy : creates
    ExactSplit ..|> SplitStrategy
    EqualSplit ..|> SplitStrategy
`;
const { svg } = await mermaid.render('cd-svg', src);
document.getElementById('cd').innerHTML = svg;
document.querySelectorAll('#cd svg.classDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});
document.querySelectorAll('#cd svg.classDiagram .row-rect-odd path, #cd svg.classDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
